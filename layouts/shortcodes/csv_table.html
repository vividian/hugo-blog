{{ $csv := getCSV "," (.Get 0) }}
<table class="csv-table">
  <thead>
    <tr>
      {{ range index $csv 0 }}
        <th>{{ . }}</th>
      {{ end }}
    </tr>
  </thead>
  <tbody>
    {{ range after 1 $csv }}
    <tr>
      {{ range . }}
        <td>{{ . }}</td>
      {{ end }}
    </tr>
    {{ end }}
  </tbody>
</table>
